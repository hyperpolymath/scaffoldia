#
# Conformance workflow (owner decision 2026-11-17, ADR-0003).
#
# The required check is named after the highest conformance level the engine
# actually passes: `Conformance L0` today, later L1, L2, L3 as those levels
# exist (verification/conformance/README.adoc). There is no "E2E" job: it is
# retired until Scaffoldia can mint something end to end. The inherited
# Idris2/Zig harness tests/e2e.sh is no longer run here (docs/status/ROADMAP.adoc).
#
# The commands live in verification/conformance/check-l0.sh, which
# `just conformance` also calls. Needs cargo, rustc, jq and coreutils, all on a
# stock ubuntu-latest image.

name: Conformance
on:
  push:
    branches: [main, master, develop]
  # No `paths:` filter on pull_request: a required check that is skipped by a
  # path filter never reports, and the pull request would wait forever.
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions: read-all
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance-l0:
    name: Conformance L0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Build kernel, check fixtures, run L0, run negative controls
        run: |
          set -euo pipefail
          bash verification/conformance/check-l0.sh
